server:
  address: ${BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/icu_sepsis_dev}
      auto-index-creation: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  demo: ${DEMO_MODE:false}
  # demo: 只读演示库 icu_sepsis_*；smartcare: 只读医院 SmartCare/DataCenter + 业务写仍进 icu_sepsis_*
  source:
    mode: ${CLINICAL_SOURCE_MODE:smartcare}
    connect-timeout-ms: ${SOURCE_CONNECT_TIMEOUT_MS:5000}
    socket-timeout-ms: ${SOURCE_SOCKET_TIMEOUT_MS:15000}
    smartcare:
      uri: ${SMARTCARE_MONGO_URI:mongodb://192.168.31.185:27017/SmartCare}
      # 仅 SmartCare；空 = 免密。不要写 DataCenter 账号到这里。
      username: ${SMARTCARE_MONGO_USERNAME:}
      password: ${SMARTCARE_MONGO_PASSWORD:}
      # 空则默认用 URI 里的库名 SmartCare
      auth-source: ${SMARTCARE_MONGO_AUTH_SOURCE:}
    datacenter:
      # 独立 client + 独立凭证，禁止复用 SmartCare/@Primary
      uri: ${DATACENTER_MONGO_URI:mongodb://192.168.31.185:27017/DataCenter}
      username: ${DATACENTER_MONGO_USERNAME:}
      password: ${DATACENTER_MONGO_PASSWORD:}
      # 空则默认用 URI 里的库名 DataCenter（避免 authSource=SmartCause not authorized on DataCenter）
      auth-source: ${DATACENTER_MONGO_AUTH_SOURCE:}
  # 纯 iframe 接入不需要医院 SSO：宿主 SmartCareReady/SmartCare → /embed-api/host-context 即可
  # ICU-05 感染性休克 Bundle（科室主任规则 v3）
  icu05:
    blood-culture-keywords: ${ICU05_BLOOD_CULTURE_KEYWORDS:血培养}
    culture-time-field: ${ICU05_CULTURE_TIME_FIELD:reviewTime}
  embed-parent-origins: ${EMBED_PARENT_ORIGINS:}
  embed:
    allow-insecure-lan-origins: ${EMBED_ALLOW_INSECURE_LAN_ORIGINS:true}
    allow-any-frame-ancestor: ${EMBED_ALLOW_ANY_FRAME_ANCESTOR:false}
  doctor-password: ${DOCTOR_PASSWORD:}
  nurse-password: ${NURSE_PASSWORD:}
  quality-password: ${QUALITY_PASSWORD:}
  department: ${AUTHORIZED_DEPARTMENT:DEMO-ICU}
  # Hospital-intranet OpenAI-compatible model gateway. Off by default; the workbench works identically without it.
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    chat-path: ${AI_CHAT_PATH:/v1/chat/completions}
    embeddings-path: ${AI_EMBEDDINGS_PATH:/v1/embeddings}
    models:
      fast: ${AI_MODEL_FAST:}
      reasoning: ${AI_MODEL_REASONING:}
      embedding: ${AI_MODEL_EMBEDDING:}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:3000}
    fast-timeout-ms: ${AI_FAST_TIMEOUT_MS:25000}
    reasoning-timeout-ms: ${AI_REASONING_TIMEOUT_MS:90000}
    max-tokens: ${AI_MAX_TOKENS:1500}
    max-concurrent: ${AI_MAX_CONCURRENT:4}
    temperature: ${AI_TEMPERATURE:0.2}
    json-mode: ${AI_JSON_MODE:true}
    tls-insecure: ${AI_TLS_INSECURE:false}
    tls-ca-file: ${AI_TLS_CA_FILE:}
    store-prompt: ${AI_STORE_PROMPT:true}
    knowledge-dir: ${AI_KNOWLEDGE_DIR:}
    time-zone: ${AI_TIME_ZONE:Asia/Shanghai}
  rules:
    version: draft-demo-v1
    approval: DRAFT_DEMO_ONLY
    map-low: 65
    sbp-low: 90
    lactate-high: 2
    fresh-minutes: 120
    lab-fresh-minutes: 360
    review-deadline-minutes: 60
logging:
  level:
    org.mongodb.driver: WARN
springdoc:
  swagger-ui:
    path: /api-docs
