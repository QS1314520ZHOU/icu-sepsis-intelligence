<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ICU 宿主 iframe 集成演示</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
        color: #24354e;
        background: #eef2f8;
      }
      button,
      input {
        font: inherit;
      }
      button {
        min-height: 44px;
        padding: 9px 16px;
        border: 1px solid #c2d1e7;
        border-radius: 6px;
        background: white;
        color: #315b9e;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      button.primary {
        background: #3567d6;
        color: white;
        border-color: #3567d6;
      }
      :focus-visible {
        outline: 3px solid #819ee8;
        outline-offset: 3px;
      }
      .top {
        height: 64px;
        background: #3567d6;
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        gap: 20px;
      }
      .brand {
        font-size: 19px;
        font-weight: 650;
      }
      .brand span {
        font-size: 13px;
        font-weight: 400;
        border-left: 1px solid #ffffff66;
        margin-left: 16px;
        padding-left: 16px;
      }
      .top small {
        color: #edf3ff;
      }
      .layout {
        display: grid;
        grid-template-columns: 232px minmax(0, 1fr);
        height: calc(100vh - 64px);
      }
      aside {
        background: white;
        border-right: 1px solid #d9e3ef;
        overflow: auto;
      }
      .ward {
        padding: 20px 16px;
        border-bottom: 1px solid #e1e7ef;
      }
      .ward strong {
        display: block;
        font-size: 16px;
      }
      .ward span {
        font-size: 12px;
        color: #64748b;
      }
      .list {
        padding: 8px;
      }
      .patient {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 12px;
        text-align: left;
        border: 0;
        border-radius: 6px;
        padding: 14px 10px;
        margin: 4px 0;
        color: #334c6d;
        min-height: 76px;
      }
      .patient b {
        background: #edf3fd;
        color: #3567d6;
        padding: 5px 8px;
        border-radius: 4px;
      }
      .patient strong {
        display: block;
        font-size: 14px;
      }
      .patient small {
        display: block;
        font-size: 11px;
        color: #64748b;
      }
      .patient.active {
        background: #e6edfc;
      }
      .patient.active b {
        background: #3567d6;
        color: white;
      }
      .patient.pending {
        background: #fff5df;
      }
      .host-main {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .host-tabs {
        min-height: 50px;
        background: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #d9e3ef;
        padding: 0 20px;
        gap: 16px;
      }
      .host-tabs strong {
        color: #2858ae;
        border-bottom: 3px solid #3567d6;
        padding: 12px 0;
      }
      .host-tabs small {
        color: #61748a;
      }
      .frame-wrap {
        flex: 1;
        min-height: 0;
        padding: 16px;
      }
      iframe {
        border: 1px solid #dce4ef;
        border-radius: 8px;
        width: 100%;
        height: 100%;
        display: block;
        background: #f3f6fb;
      }
      .status {
        min-height: 32px;
        padding: 6px 20px;
        background: white;
        border-top: 1px solid #dce4ef;
        font-size: 12px;
        color: #61748a;
        overflow-wrap: anywhere;
      }
      .login {
        position: fixed;
        inset: 0;
        background: #19365b55;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .login form {
        max-width: 440px;
        width: 100%;
        background: white;
        padding: 28px;
        border: 1px solid #dce4ef;
        border-radius: 10px;
      }
      .login h1 {
        font-size: 23px;
        margin: 0 0 12px;
      }
      .login p {
        color: #61748a;
        font-size: 13px;
      }
      .login label {
        display: block;
        margin: 16px 0;
        color: #4e6482;
      }
      .login input {
        display: block;
        width: 100%;
        min-height: 44px;
        border: 1px solid #bccce2;
        border-radius: 5px;
        padding: 9px 10px;
        margin-top: 6px;
      }
      .login .primary {
        width: 100%;
      }
      .error {
        color: #a83c35 !important;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 800px) {
        .layout {
          grid-template-columns: 176px minmax(0, 1fr);
        }
        .brand span,
        .top small {
          display: none;
        }
        .top {
          padding: 0 16px;
        }
        .frame-wrap {
          padding: 8px;
        }
        .host-tabs {
          padding: 0 12px;
        }
        .host-tabs small {
          display: none;
        }
        .ward {
          padding: 16px 12px;
        }
        .patient {
          padding: 12px 6px;
          gap: 6px;
        }
      }
      @media (max-width: 650px) {
        .layout {
          grid-template-columns: 72px minmax(0, 1fr);
        }
        .ward {
          padding: 14px 6px;
          text-align: center;
        }
        .ward strong {
          font-size: 12px;
        }
        .ward span,
        .patient > span {
          display: none;
        }
        .list {
          padding: 4px;
        }
        .patient {
          justify-content: center;
          min-height: 64px;
        }
        .top .brand {
          font-size: 16px;
        }
        .host-tabs strong {
          font-size: 13px;
        }
        .frame-wrap {
          padding: 6px;
        }
        .status {
          padding: 6px 10px;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand">ICU 宿主工作站<span>患者　　护理　　医生　　质控</span></div>
      <small>宿主集成演示 · 非医院实际系统</small><span id="account">未登录</span>
    </header>
    <div class="layout">
      <aside>
        <div class="ward"><strong>宿主患者列表</strong><span>患者选择只在这里发生</span></div>
        <div class="list" id="patients"></div>
      </aside>
      <main class="host-main">
        <div class="host-tabs">
          <strong>脓毒症风险与质控</strong><small>宿主负责全局导航，iframe 仅显示当前患者</small>
        </div>
        <div class="frame-wrap">
          <iframe title="脓毒症患者工作区" id="workbench" referrerpolicy="no-referrer"></iframe>
        </div>
        <div class="status" role="status" id="status">正在初始化嵌入工作区…</div>
      </main>
    </div>
    <div class="login" id="login">
      <form id="login-form">
        <h1>宿主演示认证</h1>
        <p>
          此处仅使用隔离演示系统账号。真实接入时由宿主 SSO 服务签发一次性票据，不在 iframe
          内重复登录。
        </p>
        <label
          >角色账号<input name="username" autocomplete="username" value="doctor" required /></label
        ><label
          >演示密码<input name="password" type="password" autocomplete="current-password" required
        /></label>
        <p id="login-error" class="error"></p>
        <button class="primary" type="submit">打开宿主工作台</button>
      </form>
    </div>
    <script>
      (() => {
        'use strict';
        const frame = document.getElementById('workbench'),
          status = document.getElementById('status'),
          list = document.getElementById('patients');
        const childOrigin =
          location.protocol +
          '//' +
          (location.hostname === 'localhost' ? '127.0.0.1' : 'localhost') +
          ':' +
          (location.port || '8080');
        if (!['localhost', '127.0.0.1'].includes(location.hostname)) {
          status.textContent = '此文件仅用于本机隔离演示。生产宿主请按协议集成。';
          return;
        }
        let auth = '',
          patients = [],
          channel = '',
          active = '',
          pending = null;
        const requests = new Map();
        const ns = 'icu.sepsis';
        function draw() {
          list.replaceChildren();
          for (const p of patients) {
            const b = document.createElement('button');
            b.className =
              'patient' +
              (active === p.id ? ' active' : '') +
              (pending?.patientId === p.id ? ' pending' : '');
            b.dataset.patientId = p.id;
            b.setAttribute('aria-label', p.bed + ' 床 ' + p.label);
            b.disabled = !!pending;
            const bed = document.createElement('b');
            bed.textContent = p.bed;
            const text = document.createElement('span'),
              name = document.createElement('strong'),
              small = document.createElement('small');
            name.textContent = p.label;
            small.textContent = p.id;
            text.append(name, small);
            b.append(bed, text);
            b.addEventListener('click', () => void choose(p));
            list.append(b);
          }
        }
        async function request(path, body) {
          const response = await fetch(path, {
            method: body ? 'POST' : 'GET',
            headers: { Authorization: 'Basic ' + auth, 'Content-Type': 'application/json' },
            body: body ? JSON.stringify(body) : undefined,
          });
          const result = await response.json();
          if (!response.ok) throw Error(result.message || '请求失败');
          return result.data;
        }
        async function choose(p) {
          if (!channel || !auth || pending) return;
          const requestId = crypto.randomUUID();
          pending = { patientId: p.id, requestId };
          draw();
          status.textContent = '切换待确认：' + p.label + '；宿主选中态在 iframe 核验成功后更新。';
          try {
            const t = await request('/api/v1/embed-codes', {
              patientId: p.id,
              encounterId: p.encounterId,
              parentOrigin: location.origin,
              channel,
            });
            requests.set(requestId, p);
            setTimeout(() => {
              if (pending?.requestId === requestId) {
                active = '';
                pending = null;
                requests.delete(requestId);
                frame.contentWindow.postMessage(
                  {
                    namespace: ns,
                    version: 1,
                    type: 'CLEAR_CONTEXT',
                    channel,
                    requestId: crypto.randomUUID(),
                  },
                  childOrigin,
                );
                status.textContent = '切换超时，已清空上下文，请重新选择患者。';
                draw();
              }
            }, 12000);
            frame.contentWindow.postMessage(
              {
                namespace: ns,
                version: 1,
                type: 'SET_CONTEXT',
                channel,
                requestId,
                payload: { code: t.code, patientId: p.id, encounterId: p.encounterId },
              },
              childOrigin,
            );
          } catch (e) {
            pending = null;
            status.textContent = e.message;
            draw();
          }
        }
        window.addEventListener('message', (event) => {
          if (event.source !== frame.contentWindow || event.origin !== childOrigin) return;
          const m = event.data;
          if (!m || m.namespace !== ns || m.version !== 1 || typeof m.channel !== 'string') return;
          if (m.type === 'READY') {
            channel = m.channel;
            active = '';
            pending = null;
            requests.clear();
            status.textContent = '嵌入模块就绪，请在宿主左侧选择患者。';
            draw();
            if (auth && patients.length)
              void choose(patients.find((p) => p.id === 'demo-deteriorating') || patients[0]);
            return;
          }
          if (m.channel !== channel) return;
          if (m.type === 'CONTEXT_APPLIED' && pending?.requestId === m.requestId) {
            const p = requests.get(m.requestId);
            if (!p || m.payload?.patientId !== p.id || m.payload?.encounterId !== p.encounterId)
              return;
            active = p.id;
            pending = null;
            requests.delete(m.requestId);
            status.textContent =
              '已核验：' + p.label + ' · ' + p.encounterId + ' · 患者选择由宿主统一管理';
            draw();
          } else if (m.type === 'CONTEXT_REJECTED' && pending?.requestId === m.requestId) {
            pending = null;
            requests.delete(m.requestId);
            status.textContent =
              m.payload?.reason === 'UNSAVED_OR_BUSY'
                ? '当前操作尚未保存或正在处理中，请先完成 / 取消，再切换患者。'
                : '未应用患者上下文，请检查票据、权限和住院关联。';
            draw();
          } else if (m.type === 'CONTEXT_CLEARED') {
            active = '';
            pending = null;
            status.textContent = '当前患者上下文已清空。';
            draw();
          } else if (m.type === 'AUTH_REQUIRED') {
            active = '';
            pending = null;
            status.textContent = '模块授权过期，请重新选择患者以授权。';
            draw();
          }
        });
        document.getElementById('login-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const form = e.target;
          auth = btoa(form.username.value + ':' + form.password.value);
          try {
            const me = await request('/api/v1/me');
            patients = (await request('/api/v1/patients')).items;
            document.getElementById('account').textContent = me.username;
            form.password.value = '';
            document.getElementById('login').hidden = true;
            draw();
            if (channel && patients.length)
              void choose(patients.find((p) => p.id === 'demo-deteriorating') || patients[0]);
          } catch (e) {
            auth = '';
            document.getElementById('login-error').textContent = e.message;
          }
        });
        frame.src = childOrigin + '/embed?parentOrigin=' + encodeURIComponent(location.origin);
      })();
    </script>
  </body>
</html>
