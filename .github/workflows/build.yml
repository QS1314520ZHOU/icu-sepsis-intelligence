name: build

# 每次推送 / PR：跑前后端测试并打包 jar（前端已内置）。
# main 分支：更新滚动预发布 "latest"（固定下载地址）；打 v* 标签：生成正式 Release。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install & unit tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Backend tests & package (bundles frontend)
        working-directory: backend
        run: mvn -B -ntp package

      - name: Checksums
        id: meta
        run: |
          mkdir -p dist
          SHORT=$(git rev-parse --short HEAD)
          cp backend/target/sepsis-intelligence-0.3.0.jar dist/sepsis-intelligence-0.3.0.jar
          cd dist
          sha256sum sepsis-intelligence-0.3.0.jar > SHA256SUMS.txt
          printf 'commit=%s\nbuilt=%s\n' "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BUILD-INFO.txt
          cat SHA256SUMS.txt BUILD-INFO.txt
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: sepsis-intelligence-${{ steps.meta.outputs.short }}
          path: dist/
          retention-days: 30

      - name: Rolling "latest" pre-release (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f latest
          git push -f origin latest
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest dist/* --prerelease --title "latest (main @ ${{ steps.meta.outputs.short }})" \
            --notes "main 分支最新构建。下载后在服务器执行 sha256sum -c SHA256SUMS.txt 校验。" --target "$GITHUB_SHA"

      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
