口径进入任务明细。<\/p><\/section><!----><!----><\/ng-component><!----><\/main><\/div><!----><!----><!----><\/body><\/html>"};const frame=document.querySelector('iframe');function show(name){for(const b of document.querySelectorAll('[data-page]')){b.classList.toggle('active',b.dataset.page===name);b.setAttribute('aria-pressed',String(b.dataset.page===name))}frame.style.height='900px';frame.srcdoc=pages[name];}frame.addEventListener('load',()=>{requestAnimationFrame(()=>{frame.style.height=Math.max(900,frame.contentDocument.documentElement.scrollHeight)+'px';});});for(const b of document.querySelectorAll('[data-page]'))b.addEventListener('click',()=>show(b.dataset.page));show('患者趋势');
